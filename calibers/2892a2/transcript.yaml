# ETA 2892-A2 in SwissLab: what each screen of the recording shows, transcribed by hand.
# tools/steps_video.py reads this file and the recording, and writes steps.json,
# assembly.json and parts.yaml.
#
# Recording: "ETA 2892-A2 disassembly and assembly (Swisslab)", YouTube, channel Chris H.,
#   https://www.youtube.com/watch?v=ficKWEWxPDo  (downloaded at 640 x 360, 23.976 fps)
#   SwissLab "the worldwide training system", version 2007-1; idea and animation tica
#   international (www.tica.dk). The recording stays on your own computer: never commit it.
#
# Per step:
#   code    SwissLab's step code, printed in the lower-left corner of the screen
#           (A = disassembly, B = assembly)
#   t       start and end of the step in the recording, seconds
#   cs      the "CS no." on screen (null: none shown)
#   part    the "Name" on screen
#   view    what the movement window shows: dial or bridge (side of the movement up), or a
#           unit taken off the movement and worked on by itself: automatic device, barrel bridge
#   note    a warning shown with the step
#   prompt  the instruction shown at the end of the step (TURN MOVEMENT ...)
#   shows   the part a step shows when the screen gives no caption (its CS number)
#   remark  ours, not on screen
meta:
  video: "https://www.youtube.com/watch?v=ficKWEWxPDo"
  title: "ETA 2892-A2 disassembly and assembly (Swisslab)"
  resolution: [640, 360]
  swisslab_version: "2007-1"
  # the movement window's frame lines in the recording (video px), mapped onto the
  # standard SwissLab window [18, 122, 432, 512] (stage px), as used for the 6497
  window_video_px: [82, 70, 341.5, 315]
  oil_legend: [Moebius D5, Jismaa 124 / Moebius 9501, Moebius 9010, Moebius 941 / 9415,
               Moebius 9010 (small quantity), Treated (ETA)]

